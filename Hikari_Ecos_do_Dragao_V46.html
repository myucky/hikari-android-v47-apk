const MW=2200,MH=1700;let seed=142;function rand(){seed=(seed*16807)%2147483647;return(seed-1)/2147483646}const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

 let body='<div class="baghead"><span>⚒️ FORJA DE TETSU</span><b>💰 '+player.coins+'</b></div><p>“Cada monstro deixa algo útil. Traga os materiais certos e vou transformar seus espólios em equipamentos de verdade.”</p><div class="forge-note">🧱 Materiais disponíveis: '+(player.loot.length?player.loot.map(it=>it.icon+' '+it.name+' ×'+it.qty).join(' · '):'nenhum. Cace monstros para coletar materiais.')+'</div><div class="itemgrid">';
 for(const r of forgeRecipes){
  const owned=r.kind==='weapon'?player.ownedWeapons.includes(r.index):player.ownedArmors.includes(r.index);
  const reqText=r.req.map(([n,q])=>(lootQty(n)>=q?'✓':'✕')+' '+n+' ×'+q+' <small>(você: '+lootQty(n)+')</small>').join('<br>');
  body+='<div class="itemcard forgecard"><span class="itemicon">'+r.icon+'</span><b>'+r.name+'</b><small>'+r.desc+'</small><p class="requirements">'+reqText+'</p><em>'+(owned?'JÁ FORJADO':hasRecipeMaterials(r)?'PRONTO PARA FORJAR':'FALTAM MATERIAIS')+'</em><button data-craft="'+r.id+'" '+(owned||!hasRecipeMaterials(r)?'disabled':'')+'>'+(owned?'Concluído':'⚒️ Forjar')+'</button></div>';
 }
 body+='</div><h3>🧪 Alquimia de campo</h3><p>Combine 2 Gel de Jade + 1 Pó de Espírito para criar uma Poção Maior (cura 100 HP).</p><button id="craftPotion" '+(lootQty('Gel de jade')<2||lootQty('Pó de espírito')<1?'disabled':'')+'>🧪 Preparar Poção Maior</button>';
 showModal('⚒️ Ferreiro e artesanato',body);
 document.querySelectorAll('[data-craft]').forEach(b=>b.onclick=()=>{
  const r=forgeRecipes.find(x=>x.id===b.dataset.craft);if(!r||!hasRecipeMaterials(r))return;
  const owned=r.kind==='weapon'?player.ownedWeapons:player.ownedArmors;if(owned.includes(r.index)){toast('Você já possui este equipamento.');return}
  for(const [name,qty] of r.req){const item=player.loot.find(it=>it.name===name);item.qty-=qty}
  player.loot=player.loot.filter(it=>it.qty>0);
  if(r.kind==='weapon')player.ownedWeapons.push(r.index);else player.ownedArmors.push(r.index);
  burst(player.x,player.y,'#ffd782',22,100);floatText(player.x,player.y-40,'FORJADO!','#ffe3a0',16);saveGame(false);updateHud();toast(r.name+' foi forjado e está na Bolsa!');openForge();
 });
 const cp=document.querySelector('#craftPotion');if(cp)cp.onclick=()=>{if(lootQty('Gel de jade')<2||lootQty('Pó de espírito')<1)return;for(const [n,q] of [['Gel de jade',2],['Pó de espírito',1]])player.loot.find(it=>it.name===n).qty-=q;player.loot=player.loot.filter(it=>it.qty>0);player.potions+=1;player.hp=Math.min(player.maxHp,player.hp+100);saveGame(false);updateHud();toast('Poção Maior preparada! +100 HP.');openForge()};
}
